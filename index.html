<!DOCTYPE html>
<html>

<head>
	<meta charset="utf8" />
	<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.min.js"></script>

	<style>
		body {
			margin: 0;
			min-height: 100vh;
		}

		#app {
			display: flex;
			flex-direction: column;
			min-height: 100vh;
			padding: 1rem;
			box-sizing: border-box;
		}

		.content {
			flex: 1;
		}

		.footer {
			margin-top: 2rem;
			padding-top: 0.75rem;
			border-top: 1px solid #ddd;
			font-size: 0.9em;
			color: #666;
		}

		.error {
			background-color: rgba(255, 0, 0, 0.5);
		}

		.search {
			margin-bottom: 2em;
		}
		.search > input {
			width: calc(100% - 2em);
		}

		.list > .header {
			cursor: pointer;
		}

		.plugin {
			font-family: monospace;
			cursor: pointer;
		}

		.noselect {
			user-select: none;
		}

		ul {
			margin: 0;
		}

		.result-summary {
			margin-top: 1rem;
		}

		.search-header {
			font-weight: bold;
			margin-bottom: 0.5rem;
		}

		.plugin-count {
			margin-bottom: 0.5rem;
		}

		.plugin-list {
			list-style: none;
			padding-left: 1rem;
		}

		.plugin-item {
			margin-bottom: 1rem;
		}

		.plugin-name {
			font-family: monospace;
			margin-bottom: 0.25rem;
		}

		.line-count {
			margin-bottom: 0.5rem;
		}

		.line-list {
			list-style: none;
			padding-left: 1rem;
		}

		.line-item {
			margin: 0.25rem 0;
		}

		.line-item a {
			font-family: monospace;
			font-size: 0.9em;
		}

		.summary-footer {
			margin-top: 1rem;
			padding-top: 0.5rem;
			font-size: 0.9em;
			color: #666;
			text-align: center;
		}

		.symbol-list {
			max-height: 15em;
			overflow-y: auto;
			border: 1px solid #ddd;
			padding: 0.5rem;
			margin-bottom: 0.5rem;
			background: #f9f9f9;
			font-family: monospace;
			font-size: 0.9em;
		}

		.plugin-entry {
			margin: 0.25rem 0;
		}
	</style>
</head>

<body>
<div id="app">
	Loading...
</div>

<script type="module" src="script/main.js"></script>
</body>
</html>
