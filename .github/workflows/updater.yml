name: Run Java JAR on Schedule

on:
  schedule:
    # Runs every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual triggering from the Actions tab

jobs:
  run-java:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # You can change this to 'corretto', 'zulu', etc.
          java-version: '17'      # Change to your required Java version (e.g., 11, 17, 21)

      - name: Run JAR file
        run: java -jar HubSearcher-all.jar ./plugins/commits ./plugins ./plugins/commits

        # If your JAR needs environment variables or arguments:
        # env:
        #   MY_SECRET_VAR: ${{ secrets.MY_SECRET_VAR }}
        # run: java -jar path/to/your-app.jar --arg1 value1
      - name: Commit and push search index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add . || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(search): update" || true
            git push
          else
            echo "No changes to search-index.json"
          fi

